<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suburbia Pacman Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-menu" class="overlay active">
        <h1>Suburbia Pacman</h1>
        <button id="btn-play" disabled>Loading Assets...</button>
        <button id="btn-editor" disabled>Map Editor</button>
    </div>

    <div id="ui" class="overlay">
        <h1>Learn 3 JS Games</h1>
        <p>Score: <span id="score" style="color: #ffcc00; font-weight: bold;">0 / 0</span></p>
        <p class="controls">Controls: <strong>W A S D</strong> to move</p>
    </div>

    <!-- Game Over Popup -->
    <div id="game-over" class="overlay">
        <div class="popup-box">
            <h2 id="game-over-title">Game Over!</h2>
            <p id="game-over-msg"></p>
            <button id="btn-go-menu">Return to Main Menu</button>
            <button id="btn-go-retry" style="background:#2196F3;">Play Again</button>
        </div>
    </div>

    <!-- Editor UI -->
    <div id="editor-ui" class="overlay">
        <h2>Map Builder</h2>
        <div id="editor-palette" class="toolbar">
            <!-- Populated dynamically by JS -->
        </div>
        <hr style="width: 100%; border-color: #555;">
        <div class="toolbar" style="margin-top:10px;">
            <label><input type="radio" name="tool" value="road"> Erase to Road 🛣️</label>
            <label><input type="radio" name="tool" value="gem"> Toggle Gem 💎</label>
            <label><input type="radio" name="tool" value="player"> Set Player Spawn 🚙</label>
            <label><input type="radio" name="tool" value="police"> Set Police Spawn 🚓</label>
        </div>
        <p class="controls" style="color: #ffcc00; margin-bottom: 15px;">Press <strong>R</strong> to rotate item</p>
        <button id="btn-editor-play">Play Map</button>
        <button id="btn-editor-menu" style="background:#d32f2f;">Back to Menu</button>
    </div>
    
    <!-- ES Module Shims for cross-browser module resolution -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="./main.js"></script>
</body>
</html>
