<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple 3D Web Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui">
        <h1>Learn 3 JS Games</h1>
        <p>Score: <span id="score" style="color: #ffcc00; font-weight: bold;">0 / 0</span></p>
        <p class="controls">Controls: <strong>W A S D</strong> to move</p>
    </div>
    
    <!-- ES Module Shims for cross-browser module resolution -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="./main.js"></script>
</body>
</html>
